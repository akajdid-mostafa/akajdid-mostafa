<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mostafa Akajdid - Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#13131b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="2" fill="url(#accent)"/>

  <!-- architectural blueprint marks -->
  <g stroke="rgba(255,255,255,0.07)" fill="none" stroke-width="1.2">
    <line x1="820" y1="60" x2="820" y2="250"/>
    <line x1="700" y1="60" x2="700" y2="250"/>
    <rect x="852" y="70" width="86" height="56"/>
    <line x1="852" y1="98" x2="938" y2="98"/>
    <circle cx="895" cy="98" r="3" fill="rgba(255,255,255,0.14)" stroke="none"/>
  </g>
  <g stroke="rgba(52,211,153,0.35)" stroke-width="1.2">
    <line x1="700" y1="180" x2="938" y2="180"/>
    <circle cx="838" cy="180" r="4" fill="#34d399" stroke="none"/>
  </g>

  <text x="80" y="118" font-family="'Segoe UI', -apple-system, sans-serif" font-size="52" font-weight="700" fill="#f3f4f6">Mostafa Akajdid</text>

  <rect x="82" y="138" width="48" height="4" fill="url(#accent)"/>

  <text x="80" y="182" font-family="'Segoe UI', -apple-system, sans-serif" font-size="22" font-weight="600" fill="#34d399" letter-spacing="2">FULL-STACK DEVELOPER</text>
  <text x="80" y="212" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" fill="#9ca3af">Casablanca, Morocco</text>

  <text x="80" y="252" font-family="'Georgia', 'Times New Roman', serif" font-style="italic" font-size="19" fill="#c7cdd6">I start with the user experience, then build the architecture that makes it possible.</text>
</svg>
